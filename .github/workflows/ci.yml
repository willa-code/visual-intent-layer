name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: Upload the gallery render this runner produced
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gallery-actual
          path: .scratch/gallery-*.actual.png
          include-hidden-files: true
          if-no-files-found: ignore
      - run: npm run build
      - run: npm run benchmark
      - run: node scripts/check-bins.js
      - run: npm install -g --prefix /tmp/vil-ci . && /tmp/vil-ci/bin/visual-intent --help
