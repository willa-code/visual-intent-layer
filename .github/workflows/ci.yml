name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint the commit messages in this change
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          case "$base" in
            ""|0000000000000000000000000000000000000000)
              base="$(git rev-list --max-parents=0 HEAD | tail -1)"
              ;;
          esac
          if [ "$(git rev-list --count "$base"..HEAD)" = "0" ]; then
            echo "No new commits to lint."
            exit 0
          fi
          npx commitlint --verbose --from "$base" --to HEAD
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: node scripts/check-records.js
      - run: npm test
      - name: Upload the gallery render this runner produced
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gallery-actual
          path: .scratch/gallery-*.actual.png
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Upload the Playwright traces this runner kept
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-traces
          path: .scratch/traces/*.zip
          include-hidden-files: true
          if-no-files-found: ignore
      - run: npm run build
      - run: npm run benchmark
      - run: node scripts/check-bins.js
      - run: npm install -g --prefix /tmp/vil-ci . && /tmp/vil-ci/bin/visual-intent --help
