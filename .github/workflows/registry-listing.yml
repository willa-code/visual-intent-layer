name: Registry listing

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  listing:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help > /dev/null
      - name: Validate server.json
        run: ./mcp-publisher validate
      - name: Authenticate as this repository
        run: ./mcp-publisher login github-oidc
      - name: Publish the listing
        run: ./mcp-publisher publish
